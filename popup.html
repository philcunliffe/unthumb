<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 16px;
      margin: 0;
      color: #1a1a1a;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 16px;
    }
    .setting-group {
      margin-bottom: 16px;
    }
    .setting-label {
      font-weight: 600;
      margin-bottom: 6px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .slider-row input[type="range"] {
      flex: 1;
    }
    .slider-value {
      min-width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .checkbox-row label {
      cursor: pointer;
    }
    .radio-group label {
      display: block;
      margin: 4px 0;
      cursor: pointer;
    }
    .disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .divider {
      border-top: 1px solid #e0e0e0;
      margin: 16px 0;
    }
    .kofi-link {
      color: #e02020;
      text-decoration: none;
      font-weight: 500;
    }
    .kofi-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>unthumb</h1>

  <div class="setting-group">
    <div class="setting-label">Frame position</div>
    <div class="slider-row" id="slider-container">
      <input type="range" id="fraction" min="0" max="100" value="30">
      <span class="slider-value" id="fraction-value">30%</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="random">
      <label for="random">Random position per video</label>
    </div>
  </div>

  <div class="setting-group">
    <div class="setting-label">When storyboard unavailable</div>
    <div class="radio-group">
      <label>
        <input type="radio" name="fallback" value="original" checked>
        Show original thumbnail
      </label>
      <label>
        <input type="radio" name="fallback" value="black">
        Show black box
      </label>
    </div>
  </div>

  <div class="divider"></div>
  <a class="kofi-link" href="https://ko-fi.com/philcunliffe" target="_blank">Support on Ko-fi &#x2615;</a>

  <script src="popup.js"></script>
</body>
</html>
